name: Build & Release VSIX

# Trigger whenever a tag matching "v*" (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - 'v*'

# Grant the token permission to create/update GitHub Releases.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history so the tag is available for `git archive`.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Derive the current tag (e.g. "v0.1.0").
      - name: Resolve tag name
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Keep package.json version in sync with the tag so the produced
      # VSIX is named/versioned exactly like the release tag (v1.2.3 -> 1.2.3).
      - name: Sync package version with tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      # Compile and package the extension into a .vsix file.
      - name: Build VSIX
        run: npx @vscode/vsce package --no-dependencies --out .

      # Archive the committed source at this tag. Using `git archive`
      # avoids tar's "file changed as we read it" error (the archive is
      # written inside the directory being archived) and only packages
      # files that are actually committed to git.
      - name: Create source archive
        run: |
          git archive --format=tar.gz -o "autocomplete-source-${{ steps.tag.outputs.tag }}.tar.gz" "${{ steps.tag.outputs.tag }}"

      # Create (or update) a GitHub Release for this tag and attach assets.
      # GitHub also auto-attaches its own "Source code (zip/tar.gz)" links.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.tar.gz
          generate_release_notes: true
